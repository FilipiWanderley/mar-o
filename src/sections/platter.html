<section class="platter" id="platter" data-bg="dark" aria-labelledby="platter-title">
  <h2 id="platter-title" class="sr-only">Our Brazilian burgers</h2>
  <div class="platter-pin">
    <div class="platter-names" aria-hidden="true">
      <p class="pname" data-i="0">X-Burguer</p>
      <p class="pname" data-i="1">X-Egg</p>
      <p class="pname" data-i="2">X-Bacon</p>
      <p class="pname" data-i="3">X-Calabresa</p>
      <p class="pname" data-i="4">X-Tudo</p>
      <p class="pname" data-i="5">Super X-Tudo</p>
    </div>

    <div class="ring" data-ring>
      <img class="ring-item" src="/img/prato/xburguer.webp" alt="" data-i="0" width="1000" height="1000">
      <img class="ring-item" src="/img/prato/xegg.webp" alt="" data-i="1" width="1000" height="1000" loading="lazy">
      <img class="ring-item" src="/img/prato/xbacon.webp" alt="" data-i="2" width="1000" height="1000" loading="lazy">
      <img class="ring-item" src="/img/prato/xcalabresa.webp" alt="" data-i="3" width="1000" height="1000" loading="lazy">
      <img class="ring-item" src="/img/prato/xtudo.webp" alt="" data-i="4" width="1000" height="1000" loading="lazy">
      <img class="ring-item" src="/img/prato/superxtudo.webp" alt="" data-i="5" width="1000" height="1000" loading="lazy">
    </div>
    <button class="ring-btn" type="button" data-ring-next aria-label="Burger 1 of 6, X-Burguer. Turn the platter to X-Egg"></button>

    <div class="pinfo pinfo--left" aria-live="polite">
      <p class="pinfo-title" data-p-title>X-Burguer</p>
      <p class="pinfo-desc" data-p-desc>Beef patty, mozzarella, lettuce, tomato, corn, potato sticks and mayo. Where every X starts.</p>
    </div>
    <div class="pinfo pinfo--right">
      <p class="pinfo-price" data-p-price>$13.99</p>
      <p class="pinfo-note">Brazilian burger · 61 Hollis St</p>
      <a class="btn btn--red" href="{{ORDER}}" data-p-order><span class="btn-label">Order the X-Burguer</span><span class="btn-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13m-5-6 6 6-6 6"/></svg></span></a>
    </div>

    <ol class="platter-dots" aria-hidden="true"><li></li><li></li><li></li><li></li><li></li><li></li></ol>
  </div>
</section>
